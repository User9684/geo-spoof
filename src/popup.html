<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geolocation Spoofer</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
</head>

<body>
    <header class="header">
        <div class="eyebrow">LOCATION CONTROL</div>
        <h1>Geolocation Spoofer</h1>
        <p>Set the coordinates your browser reports.</p>
    </header>
    <main class="container">
        <section class="panel location-panel">
            <div class="panel-heading">
                <h2>Position</h2>
                <label class="switch" aria-label="Spoofer enabled">
                    <input type="checkbox" id="enabled" />
                    <span class="slider"></span>
                </label>
            </div>
            <div class="field-grid">
                <div class="field">
                    <label for="latitude">Latitude</label>
                    <input type="text" id="latitude" placeholder="37.7749" />
                </div>
                <div class="field">
                    <label for="longitude">Longitude</label>
                    <input type="text" id="longitude" placeholder="-122.4194" />
                </div>
            </div>
            <div class="field">
                <label for="accuracy">Accuracy <span>(meters)</span></label>
                <input type="number" id="accuracy" placeholder="100" />
            </div>
            <label class="check-row" for="toggleRandomization">
                <input type="checkbox" id="toggleRandomization" />
                <span>Randomize within accuracy</span>
            </label>
        </section>

        <section class="actions">
            <button class="button button-secondary" id="useMapsPosition">
                <span class="button-icon" aria-hidden="true">⌖</span>
                Use position from Maps
            </button>
            <button class="button button-primary" id="confirmData">Save position</button>
            <button class="button button-secondary" id="runTests" type="button">Run page tests</button>
        </section>

        <div class="test-results" id="testResults" aria-live="polite"></div>

        <section class="panel saved-panel">
            <div class="panel-heading saved-heading">
                <div>
                    <h2>Saved locations</h2>
                    <p>Drag or use arrows to reorder</p>
                </div>
                <button class="text-button" id="saveLocation" type="button">+ Save current</button>
            </div>
            <div class="saved-list" id="savedLocations">
                <p class="empty-state">No saved locations yet.</p>
            </div>
        </section>

        <details class="advanced">
            <summary>Advanced raw data</summary>
            <label for="raw">Configuration JSON</label>
            <input type="text" id="raw" placeholder="{}" />
            <button class="button button-secondary" id="confirmRawData">Apply raw update</button>
        </details>

        <div class="status" id="status">
            Loading current configuration...
        </div>
    </main>
</body>

</html>
